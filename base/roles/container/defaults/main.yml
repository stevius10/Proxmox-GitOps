proxmox_auth: "{{ proxmox_auth_token if (CREDENTIALS_PASSWORD | default('') | trim) == '' else proxmox_auth_cookie }}"

proxmox_auth_token:
  Authorization: "PVEAPIToken={{ CREDENTIALS_USER }}!{{ CREDENTIALS_TOKEN }}={{ CREDENTIALS_SECRET }}"

proxmox_auth_cookie:
  Cookie: "PVEAuthCookie={{ proxmox_login.json.data.ticket }}"
  CSRFPreventionToken: "{{ proxmox_login.json.data.CSRFPreventionToken }}"

proxmox_cred:
  api_host: "{{ PROXMOX_HOST }}"
  api_user: "{{ CREDENTIALS_USER }}"
  api_password: "{{ CREDENTIALS_PASSWORD | default(omit) }}"
  api_token_id: "{{ CREDENTIALS_TOKEN if (CREDENTIALS_PASSWORD | default('') | trim) == '' else omit }}"
  api_token_secret: "{{ CREDENTIALS_SECRET if (CREDENTIALS_PASSWORD | default('') | trim) == '' else omit }}"
  api_port: "{{ proxmox_port | default(8006) }}"
  node: "{{ PROXMOX_NODE }}"

proxmox_port: 8006
ssh_port: 22

check_delay: 4
check_retries: 15
