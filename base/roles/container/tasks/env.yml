- name: Environment
  block:
    - name: Get environment configuration
      block:
        - name: Set Proxmox credentials by environment
          ansible.builtin.set_fact:
            PROXMOX_HOST:     "{{ lookup('env', 'PROXMOX_HOST')     | default('', true) }}"
            PROXMOX_USER:     "{{ lookup('env', 'PROXMOX_USER')     | default('', true) }}"
            PROXMOX_PASSWORD: "{{ lookup('env', 'PROXMOX_PASSWORD') | default('', true) }}"
            PROXMOX_TOKEN:    "{{ lookup('env', 'PROXMOX_TOKEN')    | default('', true) }}"
            PROXMOX_SECRET:   "{{ lookup('env', 'PROXMOX_SECRET')   | default('', true) }}"

        - name: Check Proxmox credentials by environment
          ansible.builtin.set_fact:
            credentials_provided: "{{ (PROXMOX_PASSWORD != '') or (PROXMOX_TOKEN != '' and PROXMOX_SECRET != '') }}"

        - name: Proxmox credentials from file configuration
          when: not credentials_provided
          block:
            - name: Ensure configuration file
              ansible.builtin.stat:
                path: "{{ PROXMOX_DIR }}/local/{{ item }}"
              loop:
                - config.local.json
                - config.json
              register: config_files

            - name: Set active configuration file path
              ansible.builtin.set_fact:
                config_path: "{{ config_files.results | selectattr('stat.exists') | map(attribute='stat.path') | first | default(none) }}"

            - name: Load configuration file
              when: config_path is not none
              ansible.builtin.include_vars:
                file: "{{ active_config_path }}"
                name: config

            - name: Apply Proxmox credentials from file configuration
              when: config is defined and config.proxmox is defined
              ansible.builtin.set_fact:
                PROXMOX_HOST:     "{{ PROXMOX_HOST     | default(config.proxmox.host     | default(''), true) }}"
                PROXMOX_USER:     "{{ PROXMOX_USER     | default(config.proxmox.user     | default(''), true) }}"
                PROXMOX_PASSWORD: "{{ PROXMOX_PASSWORD | default(config.proxmox.password | default(''), true) }}"
                PROXMOX_TOKEN:    "{{ PROXMOX_TOKEN    | default(config.proxmox.token    | default(''), true) }}"
                PROXMOX_SECRET:   "{{ PROXMOX_SECRET   | default(config.proxmox.secret   | default(''), true) }}"

    - name: Get Proxmox privileges
      block:
        - name: Get root user ticket
          ansible.builtin.uri:
            url: "https://{{ PROXMOX_HOST }}:8006/api2/json/access/ticket"
            method: POST
            body:
              username: "{{ PROXMOX_USER }}"
              password: "{{ PROXMOX_PASSWORD }}"
            body_format: json
            validate_certs: no
          register: proxmox_login
          when: (PROXMOX_PASSWORD | default('')) | trim != ''
