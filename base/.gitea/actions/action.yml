inputs:
  ip:
    required: true
    type: string
  id:
    required: true
    type: number
  hostname:
    required: true
    type: string
  cores:
    required: true
    type: number
  memory:
    required: true
    type: number
  swap:
    required: true
    type: number
  disk:
    required: true
    type: string
  boot:
    required: true
    type: string
  mount:
    required: true
    type: string

# Overwrite

  share: # config: network share
    required: false
    default: false
    type: boolean

  dir:
    required: no
    default: "/tmp/config"
    type: string

runs:
  using: composite
  steps:
    - name: Checkout base
      uses: tasks/checkout@v7
      with:
        repository: main/base
        ref: main
        path: base

    - name: Configure Proxmox
      shell: bash
      working-directory: base
      env:
        IP: ${{ inputs.ip }}
        ID: ${{ inputs.id }}
        HOSTNAME: ${{ inputs.hostname }}
        CORES: ${{ inputs.cores }}
        MEMORY: ${{ inputs.memory }}
        SWAP: ${{ inputs.swap }}
        DISK: ${{ inputs.disk }}
        BOOT: ${{ inputs.boot }}
        MOUNT: ${{ inputs.mount }}
        SHARE: ${{ inputs.share }}
        PROXMOX_DIR: ${{ inputs.dir || env.PROXMOX_DIR || '/tmp/config' }}
      run: |
        ansible-playbook default.yml \
          -e "ip=$IP" -e "id=$ID" -e "hostname=$HOSTNAME" \
          -e "cores=$CORES" -e "memory=$MEMORY" -e "swap=$SWAP" \
          -e "disk=$DISK" -e "boot=$BOOT" -e "mount=$MOUNT" -e "share=${{ env.PROXMOX_PASSWORD && inputs.share || 'false' }}"
