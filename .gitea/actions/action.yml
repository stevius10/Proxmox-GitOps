inputs:
  repo:
    required: true
    type: string
  branch:
    required: true
    type: string
    default: "main"

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: tasks/checkout@v7
      with:
        repository: "${{ inputs.repo }}"
        ref: "${{ inputs.branch }}"
        path: repo

    - name: Configure container
      id: init
      shell: bash
      run: |
        repository="${{ inputs.repo }}"
        repo="${repository##*/}" && echo "repo=$repo" >> "$GITEA_ENV"
        stage="${repository%/*}" && echo "stage=$stage" >> "$GITEA_ENV"

        cd repo && for env in container{".env",".local.env",".${stage}.env"}; do
          [[ -f "${env}" ]] && source "${env}" || true
        done

        [[ "$stage" == "main" ]] && hostname="$repo" || hostname="${stage}-${repo}"
        echo "stage=$stage" >> "$GITEA_ENV"
        echo "hostname=$hostname" >> "$GITEA_ENV"

        echo "ip=$IP" >> "$GITEA_ENV"
        echo "id=$ID" >> "$GITEA_ENV"
        echo "cores=$CORES" >> "$GITEA_ENV"
        echo "memory=$MEMORY" >> "$GITEA_ENV"
        echo "swap=$SWAP" >> "$GITEA_ENV"
        echo "disk=$DISK" >> "$GITEA_ENV"
        echo "boot=$BOOT" >> "$GITEA_ENV"
        echo "mount=$MOUNT" >> "$GITEA_ENV"

    - name: Base configuration
      uses: main/base/.gitea/actions@main
      with:
        ip: ${{ env.ip }}
        id: ${{ env.id }}
        hostname: ${{ env.hostname }}
        cores: ${{ env.cores }}
        memory: ${{ env.memory }}
        swap: ${{ env.swap }}
        disk: ${{ env.disk }}
        boot: ${{ env.boot }}
        mount: ${{ env.mount }}
      if: ${{ gitea.ref == 'refs/heads/release' }}

    - name: Checkout repository
      uses: tasks/checkout@v7
      with:
        repository: "${{ inputs.repo }}"
        ref: "${{ inputs.branch }}"
        path: "${{ env.repo }}"

    - name: Checkout libraries
      uses: tasks/checkout@v7
      with:
        repository: 'main/libraries'
        ref: 'main'
        path: "${{ env.repo }}/libraries"

    - name: Create Snapshot
      if: ${{ inputs.branch == 'snapshot' }}
      run: echo "Utils.snapshot(self, node['snapshot']['data'])" > "${{ env.repo }}/recipes/default.rb"
      shell: bash

    - name: Configure container
      env:
        IP: ${{ env.ip }}
        ID: ${{ env.id }}
        STAGE: ${{ env.stage }}
        REPO: ${{ env.repo }}
      run: |
        tar -c "${{ env.repo }}" -cz | ssh -o StrictHostKeyChecking=no -i "/share/.keys/${{ env.id }}" "config@${{ env.ip }}" 'sudo tar xz -C /tmp
        sudo -E IP="'"${IP}"'" ID="'"${ID}"'" MOUNT="'"${MOUNT}"'" STAGE="'"${STAGE}"'" HOST="'"${HOST}"'" USER_LOGIN="'"${USER_LOGIN}"'" USER_PASSWORD="'"${USER_PASSWORD}"'" DIR="$(pwd)" PWD="$(pwd)" \
          PROXMOX_HOST="'"${PROXMOX_HOST}"'" CREDENTIALS_USER="'"${CREDENTIALS_USER}"'" CREDENTIALS_PASSWORD="'"${CREDENTIALS_PASSWORD}"'" CREDENTIALS_TOKEN="'"${CREDENTIALS_TOKEN}"'" CREDENTIALS_SECRET="'"${CREDENTIALS_SECRET}"'" \
          PROXMOX_NODE="'"${PROXMOX_NODE}"'" PROXMOX_DIR="'"${PROXMOX_DIR}"'" PROXMOX_SHARE="'"${PROXMOX_SHARE}"'" PROXMOX_STORAGE="'"${PROXMOX_STORAGE}"'" \
          PROXMOX_TEMPLATE="'"${PROXMOX_TEMPLATE}"'" PROXMOX_TIMEZONE="'"${PROXMOX_TIMEZONE}"'" PROXMOX_GATEWAY="'"${PROXMOX_GATEWAY}"'" PROXMOX_MASK="'"${PROXMOX_MASK}"'" \
          PROXMOX_INTERFACE="'"${PROXMOX_INTERFACE}"'" PROXMOX_BRIDGE="'"${PROXMOX_BRIDGE}"'" \
            cinc-client --local-mode $CONFIG_ARGS --config-option cookbook_path="/tmp" -o "${{ env.repo }}"'
