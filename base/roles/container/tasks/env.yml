- name: Environment
  block:
    - name: Get environment configuration
      block:
        - name: Set Proxmox credentials by environment
          ansible.builtin.set_fact:
            PROXMOX_HOST:     "{{ lookup('env', 'PROXMOX_HOST')     | default('', true) }}"
            CREDENTIALS_USER:     "{{ lookup('env', 'CREDENTIALS_USER')     | default('', true) }}"
            CREDENTIALS_PASSWORD: "{{ lookup('env', 'CREDENTIALS_PASSWORD') | default('', true) }}"
            CREDENTIALS_TOKEN:    "{{ lookup('env', 'CREDENTIALS_TOKEN')    | default('', true) }}"
            CREDENTIALS_SECRET:   "{{ lookup('env', 'CREDENTIALS_SECRET')   | default('', true) }}"
          no_log: true

        - name: Check Proxmox credentials by environment
          ansible.builtin.set_fact:
            credentials_provided: "{{ (CREDENTIALS_PASSWORD != '') or (CREDENTIALS_TOKEN != '' and CREDENTIALS_SECRET != '') }}"

        - name: Proxmox credentials from file configuration
          when: not credentials_provided
          block:
            - name: Ensure configuration file
              ansible.builtin.stat:
                path: "{{ PROXMOX_DIR }}/local/{{ item }}"
              loop:
                - config.local.json
                - config.json
              register: config_files

            - name: Set active configuration file path
              ansible.builtin.set_fact:
                config_path: "{{ config_files.results | selectattr('stat.exists') | map(attribute='stat.path') | first | default(none) }}"

            - name: Load configuration file
              when: config_path is not none
              ansible.builtin.include_vars:
                file: "{{ config_path }}"
                name: config
              no_log: true

            - name: Apply Proxmox credentials from file configuration
              when: config is defined and config.proxmox is defined
              ansible.builtin.set_fact:
                PROXMOX_HOST:     "{{ PROXMOX_HOST     | default(config.proxmox.host     | default(''), true) }}"
                CREDENTIALS_USER:     "{{ CREDENTIALS_USER     | default((config.host if config.host is defined and config.host is mapping else config.proxmox).user     | default(''), true) }}"
                CREDENTIALS_PASSWORD: "{{ CREDENTIALS_PASSWORD | default((config.host if config.host is defined and config.host is mapping else config.proxmox).password | default(''), true) }}"
                CREDENTIALS_TOKEN:    "{{ CREDENTIALS_TOKEN    | default((config.host if config.host is defined and config.host is mapping else config.proxmox).token    | default(''), true) }}"
                CREDENTIALS_SECRET:   "{{ CREDENTIALS_SECRET   | default((config.host if config.host is defined and config.host is mapping else config.proxmox).secret   | default(''), true) }}"
              no_log: true

    - name: Get Proxmox privileges
      block:
        - name: Get root user ticket
          ansible.builtin.uri:
            url: "https://{{ PROXMOX_HOST }}:8006/api2/json/access/ticket"
            method: POST
            body:
              username: "{{ CREDENTIALS_USER }}"
              password: "{{ CREDENTIALS_PASSWORD }}"
            body_format: json
            validate_certs: no
          register: proxmox_login
          when: (CREDENTIALS_PASSWORD | default('')) | trim != ''
          no_log: true
