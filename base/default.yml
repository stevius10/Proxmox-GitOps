---
- name: Base Container
  hosts: localhost
  gather_facts: false
  vars:
    PROXMOX_NODE: "{{ lookup('env', 'PROXMOX_NODE') | default('pve', true) }}"
    PROXMOX_STORAGE: "{{ lookup('env', 'PROXMOX_STORAGE') | default('local:vztmpl', true) }}"
    PROXMOX_TEMPLATE: "{{ lookup('env', 'PROXMOX_TEMPLATE') | default('debian-13-standard_13.6-1', true) }}"
    PROXMOX_DIR: "{{ lookup('env', 'PROXMOX_DIR') | default('/tmp/config', true) }}"
    DIR_SHARE: "{{ lookup('env', 'PROXMOX_SHARE') | default('/share', true) }}"
    DIR_CERTS: "{{ DIR_SHARE }}/.certs"
    DIR_KEYS: "{{ DIR_SHARE }}/.keys"
  tasks:
    - name: Ensure directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ DIR_SHARE }}"
        - "{{ DIR_CERTS }}"
        - "{{ DIR_KEYS }}"

    - name: Generate container key on host
      community.crypto.openssh_keypair:
        path: "{{ DIR_KEYS }}/{{ id }}"
        type: ed25519
        force: false

    - name: Configure container
      ansible.builtin.include_role:
        name: container

- name: Remote container configuration
  hosts: container
  gather_facts: true
  become: true
  vars:
    PROXMOX_DIR: "{{ lookup('env', 'PROXMOX_DIR') | default('/tmp/config', true) }}"
    DIR_SHARE: "{{ lookup('env', 'PROXMOX_SHARE') | default('/share', true) }}"
    DIR_CERTS: "{{ DIR_SHARE }}/.certs"
    DIR_KEYS: "{{ DIR_SHARE }}/.keys"
  tasks:
    - name: Copy share if exists
      ansible.builtin.copy:
        src: /share/
        dest: "{{ DIR_SHARE }}"
      when: share | default(false) | bool

    - name: Apply base configuration
      ansible.builtin.include_role:
        name: base
      tags: base

    - name: Configure mounts
      ansible.builtin.include_role:
        name: mount
      vars:
        host:     "{{ lookup('env', 'HOST') }}"
        login:    "{{ lookup('env', 'USER_LOGIN') }}"
        password: "{{ lookup('env', 'USER_PASSWORD') }}"
        mount:    "{{ mount }}"
      when:
        - lookup('env', 'CREDENTIALS_PASSWORD') | default('', true) | length > 0
        - not (share | default(false) | bool)
        - mount is defined
      tags: mounts
