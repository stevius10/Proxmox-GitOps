- name: User defaults
  block:

  - name: Set environment
    copy:
      src: environment
      dest: /etc/environment
      owner: root
      group: root
      mode: '0644'

  - name: Generate locales
    community.general.locale_gen:
      name: "{{ item }}"
      state: present
    loop:
      - "{{ locale }}"

  - name: Set locale
    copy:
      content: "LANG={{ locale }}\nLC_ALL=C.UTF-8\n"
      dest: /etc/default/locale
      owner: root
      group: root
      mode: '0644'

  - name: Set profile
    copy:
      src: profile.sh
      dest: /etc/profile.d/10-profile.sh
      owner: root
      group: root
      mode: '0644'

  - name: User
    block:
      - name: Set root bashrc
        copy:
          dest: /root/.bashrc
          content: |
            for f in /etc/profile.d/*.sh; do
              . "$f"
            done
          owner: root
          group: root
          mode: '0644'

  - name: Timezone
    block:

      - name: Timezone file
        ansible.builtin.lineinfile:
          path: /etc/timezone
          create: yes
          line: "{{ timezone }}"

      - name: Timezone link
        ansible.builtin.file:
          src: "/usr/share/zoneinfo/{{ timezone }}"
          dest: /etc/localtime
          state: link
          force: yes

      - name: Configure timezone
        ansible.builtin.command: dpkg-reconfigure -f noninteractive tzdata
